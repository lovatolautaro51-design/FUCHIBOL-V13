name: Build PS3 Toolchain

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    container:
      image: ghcr.io/ps3dev/ps3toolchain:latest

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Compilar EBOOTBIN
        run: |
          echo "Compilando proyecto..."
          # Acá podés agregar los comandos de compilación de tu proyecto
          make

      - name: Subir FUCHIBOL v13 listo
        uses: actions/upload-artifact@v4
        with:
          name: fuchibol-v13-binario
          path: |
            *.elf
            *.self
            *.bin
            EBOOT.BIN
