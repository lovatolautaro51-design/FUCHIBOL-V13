name: Compilar FUCHIBOL v13

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias y toolchain precompilado
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget libarchive-dev libssl-dev zlib1g-dev
          wget https://github.com/ps3dev/ps3toolchain/releases/latest/download/ps3dev-ubuntu-latest.tar.gz -O ps3dev.tar.gz || true
          sudo mkdir -p /usr/local/ps3dev
          if [ -f ps3dev.tar.gz ]; then sudo tar -xzf ps3dev.tar.gz -C /usr/local/ps3dev --strip-components=1; fi

      - name: Compilar EBOOT.BIN
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make
          mkdir -p PS3_GAME/USRDIR
          cp EBOOT.BIN PS3_GAME/USRDIR/EBOOT.BIN
          cp DATOS.txt PS3_GAME/USRDIR/DATOS.txt || true
          cp PARAM.SFO PS3_GAME/PARAM.SFO || true

      - name: Subir FUCHIBOL v13 listo
        uses: actions/upload-artifact@v4
        with:
          name: PS3_GAME
          path: PS3_GAME/
