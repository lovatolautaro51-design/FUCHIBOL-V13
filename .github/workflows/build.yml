name: Compilar FUCHIBOL v13

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PS3DEV: /opt/ps3dev
      PSL1GHT: /opt/psl1ght

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake cmake libtool libssl-dev libelf-dev pkg-config git wget zlib1g-dev libarchive-dev python3

      - name: Configurar directorios de PS3
        run: |
          sudo mkdir -p $PS3DEV $PSL1GHT
          sudo chown -R $USER:$USER /opt/ps3dev /opt/psl1ght

      - name: Instalar PS3 Toolchain
        run: |
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh
          cd ..

      - name: Compilar EBOOT.BIN
        run: |
          export PATH=$PS3DEV/bin:$PSL1GHT/bin:$PATH
          make
          ls -lh
          mkdir -p PS3_GAME/USRDIR
          cp EBOOT.BIN PS3_GAME/USRDIR/EBOOT.BIN
          cp DATOS.txt PS3_GAME/USRDIR/DATOS.txt || true
          cp PARAM.SFO PS3_GAME/PARAM.SFO || true

      - name: Subir FUCHIBOL v13 listo
        uses: actions/upload-artifact@v4
        with:
          name: PS3_GAME
          path: PS3_GAME/
